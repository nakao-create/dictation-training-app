soap bar to each guest, it encourages them to cut off the amount of soap they need at the front desk.  ___ into a new strategy is not easy, but through its actions, Kamikatsu is leading the nation in finding ways to gain the ___ of a truly waste-free society.  ",

  },

// ---------- パース処理 ----------
const BLANK_RE = /^([^_]*)_+([^_]*)$/;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function parseMeaning(meaningStr) {
  const map = {};
  if (!meaningStr) return map;
  String(meaningStr)
    .split(";")
    .map((s) => s.trim())
    .filter(Boolean)
    .forEach((pair) => {
      const idx = pair.indexOf("=");
      if (idx === -1) return;
      const word = pair.slice(0, idx).trim();
      const mean = pair.slice(idx + 1).trim();
      if (word) map[word.toLowerCase()] = mean;
    });
  return map;
}

function parseChoiceGroups(choicesStr) {
  if (!choicesStr) return null;
  const groups = String(choicesStr)
    .split(";")
    .map((s) => s.trim())
    .filter(Boolean);
  if (groups.length === 0) return null;
  return groups.map((g) => {
    const opts = g
      .split(",")
      .map((s) => s.trim())
      .filter(Boolean);
    let correct = "";
    const cleaned = opts.map((o) => {
      if (o.endsWith("*")) {
        correct = o.slice(0, -1).trim();
        return correct;
      }
      return o;
    });
    return { correct, options: cleaned };
  });
}

function buildWithChoices(blankedParas, choiceGroups, meaningMap) {
  const blanks = [];
  let cursor = 0;
  const paragraphs = blankedParas.map((bp) => {
    const tokens = bp.split(/\s+/).filter(Boolean);
    const template = [];
    tokens.forEach((tok) => {
      const m = tok.match(BLANK_RE);
      if (m) {
        const grp = choiceGroups[cursor] || { correct: "", options: [] };
        cursor += 1;
        const correct = grp.correct || "";
        const options = shuffle(grp.options.length ? grp.options : [correct]);
        const meaning = meaningMap[correct.toLowerCase()] || "";
        template.push({ type: "blank", prefix: m[1], suffix: m[2], correct, options, meaning });
        blanks.push(correct);
      } else {
        template.push({ type: "text", value: tok });
      }
    });
    return template;
  });
  return { paragraphs, blanks };
}

function buildWithAnswerDiff(answerParas, blankedParas, meaningMap) {
  const blanks = [];
  const paragraphs = answerParas.map((ap, pi) => {
    const answerTokens = ap.split(/\s+/).filter(Boolean);
    const blankTokens = (blankedParas[pi] || "").split(/\s+/).filter(Boolean);
    const template = [];
    blankTokens.forEach((tok, i) => {
      const m = tok.match(BLANK_RE);
      if (m) {
        const prefix = m[1];
        const suffix = m[2];
        let answerTok = answerTokens[i] || "";
        let correct = answerTok;
        if (suffix && correct.endsWith(suffix)) correct = correct.slice(0, correct.length - suffix.length);
        if (prefix && correct.startsWith(prefix)) correct = correct.slice(prefix.length);
        const meaning = meaningMap[correct.toLowerCase()] || "";
        template.push({ type: "blank", prefix, suffix, correct, options: [correct], meaning });
        blanks.push(correct);
      } else {
        template.push({ type: "text", value: tok });
      }
    });
    return template;
  });
  return { paragraphs, blanks };
}

function buildQuestion(row) {
  const title = row.title || "";
  const answer = row.answer || "";
  const blanked = row.blanked || "";
  const meaningMap = parseMeaning(row.meaning);
  const choiceGroups = parseChoiceGroups(row.choices);

  const blankedParas = String(blanked).split(/\n+/).map((s) => s.trim()).filter(Boolean);

  let built;
  if (choiceGroups) {
    built = buildWithChoices(blankedParas, choiceGroups, meaningMap);
  } else {
    const answerParas = String(answer).split(/\n+/).map((s) => s.trim()).filter(Boolean);
    built = buildWithAnswerDiff(answerParas, blankedParas, meaningMap);
  }

  return { title, answer, paragraphs: built.paragraphs, blanks: built.blanks, hasChoices: !!choiceGroups };
}

function DictationApp() {
  const [questions, setQuestions] = useState(() =>
    SAMPLE_QUESTIONS_RAW.map(buildQuestion)
  );
  const [qIndex, setQIndex] = useState(0);

  const question = questions[qIndex];

  const [filled, setFilled] = useState(() => new Array(question.blanks.length).fill(null));
  const [checked, setChecked] = useState(false);
  const [activeBlank, setActiveBlank] = useState(null);
  const [view, setView] = useState("toc");

  function resetForQuestion(idx, qs = questions) {
    const q = qs[idx];
    setFilled(new Array(q.blanks.length).fill(null));
    setChecked(false);
    setActiveBlank(null);
  }

  function goToQuestion(idx) {
    setQIndex(idx);
    resetForQuestion(idx);
    setView("question");
  }

  function goToToc() {
    setView("toc");
  }

  function openBlankPicker(blankIdx) {
    if (checked) return;
    setActiveBlank(blankIdx);
  }

  function closePicker() {
    setActiveBlank(null);
  }

  function insertWord(word) {
    if (checked) return;
    if (activeBlank === null || activeBlank === undefined) return;
    const newFilled = [...filled];
    newFilled[activeBlank] = word;
    setFilled(newFilled);
    setActiveBlank(null);
  }

  function removeFromBlank(blankIdx) {
    if (checked) return;
    if (filled[blankIdx] === null) {
      openBlankPicker(blankIdx);
      return;
    }
    const newFilled = [...filled];
    newFilled[blankIdx] = null;
    setFilled(newFilled);
  }

  const allFilled = filled.every((v) => v !== null);

  function checkAnswers() {
    if (!allFilled) return;
    setChecked(true);
  }

  function nextQuestion() {
    const next = qIndex + 1;
    if (next >= questions.length) {
      setView("toc");
      return;
    }
    setQIndex(next);
    resetForQuestion(next);
  }

  const flatBlanks = useMemo(() => {
    const list = [];
    question.paragraphs.forEach((p) =>
      p.forEach((t) => {
        if (t.type === "blank") list.push(t);
      })
    );
    return list;
  }, [question]);

  const results = useMemo(() => {
    if (!checked) return null;
    return flatBlanks.map((t, idx) => filled[idx] === t.correct);
  }, [checked, filled, flatBlanks]);

  const activeOptions = activeBlank !== null ? flatBlanks[activeBlank]?.options || [] : [];

  let blankCounter = -1;

  return (
    <div style={styles.page}>
      <div style={styles.headerBar}>
        <div style={styles.waveform}>
          {[6, 12, 20, 14, 24, 10, 18, 8, 22, 12, 6].map((h, i) => (
            <span key={i} style={{ ...styles.wbar, height: h }} />
          ))}
        </div>
        <div>
          <div style={styles.kicker}>DICTATION DRILL</div>
          <h1 style={styles.title}>速読英単語（必修編）ディクテーション トレーニング</h1>
        </div>
      </div>

      <div style={styles.uploadRow}>
        {view === "toc" ? (
          <div style={styles.progress}>全{questions.length}問</div>
        ) : (
          <>
            <button style={styles.backBtn} onClick={goToToc}>
              ← 目次に戻る
            </button>
            <div style={styles.progress}>
              問題 {qIndex + 1} / {questions.length}
            </div>
          </>
        )}
      </div>

      {view === "toc" && (
        <div style={styles.tocWrap}>
          {questions.map((q, i) => (
            <button key={i} style={styles.tocItem} onClick={() => goToQuestion(i)}>
              <span style={styles.tocIndex}>{String(i + 1).padStart(2, "0")}</span>
              <span style={styles.tocTitleText}>{q.title || `無題の問題 ${i + 1}`}</span>
              <span style={styles.tocArrow}>›</span>
            </button>
          ))}
        </div>
      )}

      {view === "question" && (
      <>
      <div style={styles.card}>
        {question.title && <div style={styles.qTitle}>{question.title}</div>}

        {question.paragraphs.map((para, pi) => {
          return (
            <p style={styles.sentence} key={pi}>
              {para.map((t, i) => {
                if (t.type === "text") {
                  return <span key={i}>{t.value} </span>;
                }
                blankCounter += 1;
                const bIdx = blankCounter;
                const word = filled[bIdx];
                let state = "empty";
                if (checked && word) {
                  state = results[bIdx] ? "correct" : "incorrect";
                } else if (word) {
                  state = "filled";
                }
                const isActive = activeBlank === bIdx;
                return (
                  <span key={i}>
                    {t.prefix}
                    <sup style={styles.blankNum}>{bIdx + 1}</sup>
                    <span
                      onClick={() => removeFromBlank(bIdx)}
                      style={{
                        ...styles.blank,
                        ...(state === "empty" ? styles.blankEmpty : {}),
                        ...(state === "filled" ? styles.blankFilled : {}),
                        ...(state === "correct" ? styles.blankCorrect : {}),
                        ...(state === "incorrect" ? styles.blankIncorrect : {}),
                        ...(isActive ? styles.blankActive : {}),
                      }}
                    >
                      {word || "\u00A0\u00A0\u00A0\u00A0\u00A0"}
                    </span>
                    {t.suffix}{" "}
                  </span>
                );
              })}
            </p>
          );
        })}

        {checked && (
          <div style={styles.answerReveal}>
            <div style={styles.answerLabel}>模範解答</div>
            {(() => {
              let n = -1;
              return question.paragraphs.map((para, pi) => (
                <p style={styles.answerPara} key={pi}>
                  {para.map((t, i) => {
                    if (t.type === "text") {
                      return <span key={i}>{t.value} </span>;
                    }
                    n += 1;
                    return (
                      <span key={i} style={styles.answerHighlightWrap}>
                        <sup style={styles.blankNum}>{n + 1}</sup>
                        <span style={styles.answerHighlight}>
                          {t.prefix}
                          {t.correct}
                          {t.suffix}
                        </span>
                        {t.meaning ? (
                          <span style={styles.answerMeaning}>「{t.meaning}」</span>
                        ) : (
                          <span style={styles.answerMeaningMissing}>（意味未入力）</span>
                        )}{" "}
                      </span>
                    );
                  })}
                </p>
              ));
            })()}
          </div>
        )}
      </div>

      <div style={styles.hintWrap}>
        <div style={styles.hintText}>
          {allFilled
            ? "すべての空欄が埋まりました"
            : `番号の付いた空欄をタップして選択してください（${filled.filter((v) => v !== null).length} / ${flatBlanks.length}）`}
        </div>
      </div>

      {activeBlank !== null && (
        <div style={styles.sheetOverlay} onClick={closePicker}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHeader}>
              <span>空欄 {activeBlank + 1} の選択肢</span>
              <button style={styles.sheetClose} onClick={closePicker}>
                閉じる
              </button>
            </div>
            <div style={styles.sheetList}>
              {activeOptions.length === 0 ? (
                <div style={styles.bankEmptyMsg}>選択肢がありません</div>
              ) : (
                activeOptions.map((opt, oi) => (
                  <button key={oi} style={styles.sheetItem} onClick={() => insertWord(opt)}>
                    {opt}
                  </button>
                ))
              )}
            </div>
          </div>
        </div>
      )}

      <div style={styles.actionRow}>
        <button
          style={{ ...styles.actionBtn, ...styles.resetBtn }}
          onClick={() => resetForQuestion(qIndex)}
        >
          リセット
        </button>
        {!checked ? (
          <button
            style={{
              ...styles.actionBtn,
              ...styles.checkBtn,
              opacity: allFilled ? 1 : 0.4,
            }}
            disabled={!allFilled}
            onClick={checkAnswers}
          >
            答え合わせ
          </button>
        ) : (
          <button
            style={{ ...styles.actionBtn, ...styles.nextBtn }}
            onClick={nextQuestion}
          >
            {qIndex + 1 < questions.length ? "次の問題" : "目次に戻る"}
          </button>
        )}
      </div>
      </>
      )}
    </div>
  );
}
